<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or register to join the AlumniConnect community. Connect with fellow graduates and unlock career opportunities.">
  <title>AlumniConnect — Login / Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🎓</div>
        <span>AlumniConnect</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="mentorship.html">Mentorship</a></li>
        <li class="nav-cta"><a href="login.html" class="btn btn-primary btn-sm active">Join Now</a></li>
      </ul>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <!-- AUTH SECTION -->
  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card glass-card">
        <div style="text-align: center; margin-bottom: 28px;">
          <h2 style="font-size: 1.7rem; margin-bottom: 8px;">Welcome Back 👋</h2>
          <p style="color: var(--text-secondary); font-size: 0.95rem;">Sign in to access your alumni network</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login" id="loginTab">Login</button>
          <button class="auth-tab" data-tab="register" id="registerTab">Register</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="return handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <div class="form-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm" onsubmit="return handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="regFirstName">First Name</label>
              <input type="text" id="regFirstName" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="regLastName">Last Name</label>
              <input type="text" id="regLastName" placeholder="Doe" required>
            </div>
          </div>
          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="regBatch">Batch Year</label>
              <select id="regBatch" required>
                <option value="">Select Year</option>
                <option>2024</option><option>2023</option><option>2022</option>
                <option>2021</option><option>2020</option><option>2019</option>
                <option>2018</option><option>2017</option><option>2016</option>
                <option>2015</option><option>2014</option><option>2013</option>
                <option>2012</option><option>2011</option><option>2010</option>
              </select>
            </div>
            <div class="form-group">
              <label for="regDepartment">Department</label>
              <select id="regDepartment" required>
                <option value="">Select Dept</option>
                <option>Computer Science</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
                <option>Electrical</option>
                <option>Information Tech</option>
                <option>Chemical</option>
                <option>Biotechnology</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="Create a password" required>
          </div>
          <div class="form-group">
            <label for="regConfirm">Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="Confirm your password" required>
          </div>
          <div class="form-options">
            <label><input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a></label>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Account</button>
        </form>

        <!-- Social Login -->
        <div class="auth-divider">or continue with</div>
        <div class="social-login">
          <button type="button" class="social-btn">🔵 Google</button>
          <button type="button" class="social-btn">🔗 LinkedIn</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <span id="toastMessage">Success!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
